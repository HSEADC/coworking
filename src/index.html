<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
  </head>
  <body class="index">
    <header class="header">
      <h1>Главная</h1>

      <ul>
        <li><a href="pages/articles.html">Статьи</a></li>
        <li><a href="pages/about.html">О нас</a></li>
        <li><a href="pages/tests.html">Тест</a></li>
        <li><a href="pages/places.html">Места</a></li>
      </ul>
    </header>

    <!-- modify this form HTML and place wherever you want your form -->
    <div data-fs-success>Thanks for your submission!</div>
    <div data-fs-error>Oops! There was a problem submitting your form.</div>
    <form id="my-form">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" data-fs-field />
      <span data-fs-error="email"></span>
      <label for="message">Message:</label>
      <input type="text" id="message" name="message" data-fs-field />
      <span data-fs-error="message"></span>
      <button type="submit" data-fs-submit-btn>Submit</button>
    </form>

    <!-- Place these scripts at the end of the body tag -->
    <script>
      window.formspree =
        window.formspree ||
        function () {
          (formspree.q = formspree.q || []).push(arguments);
        };
      formspree("initForm", {
        formElement: "#my-form",
        formId: "xvkzzzwo",
      });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  </body>
</html>
